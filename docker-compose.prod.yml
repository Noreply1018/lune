services:
  lune:
    image: ${LUNE_IMAGE:-ghcr.io/noreply1018/lune}:${LUNE_IMAGE_TAG:-latest}
    container_name: lune
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:${LUNE_PORT:-7788}:${LUNE_PORT:-7788}"
    environment:
      LUNE_PORT: "${LUNE_PORT:-7788}"
      LUNE_DATA_DIR: "/app/data"
      LUNE_ADMIN_TOKEN: "${LUNE_ADMIN_TOKEN:-}"
      LUNE_CPA_AUTH_DIR: "/app/data/cpa-auth"
      LUNE_GATEWAY_TMP_DIR: "/app/data/tmp"
      LUNE_CPA_BASE_URL: "http://127.0.0.1:8317"
      LUNE_CPA_API_KEY: "${CPA_API_KEY:-sk-cpa-default}"
      LUNE_CPA_MANAGEMENT_KEY: "${LUNE_CPA_MANAGEMENT_KEY:-lune-cpa-management-dev}"
      CPA_API_KEY: "${CPA_API_KEY:-sk-cpa-default}"
    volumes:
      - lune-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS \"http://127.0.0.1:$${LUNE_PORT:-7788}/healthz\" >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  lune-data:
